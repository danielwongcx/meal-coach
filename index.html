<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="膳食教練：每日營養對住配額，同活動環、步數。">
  <meta name="theme-color" content="#F7F4EF">
  <script>
    (function () {
      var key = "meal-coach-theme";
      var theme = "light";
      try {
        var saved = localStorage.getItem(key);
        if (saved === "light" || saved === "dark") theme = saved;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#F7F4EF" : "#16130f");
    })();
  </script>
  <title>今日 · 膳食教練</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23e15a4a' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%233c9a45' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23148a9a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#app">跳到內容</a>
  <header class="site-header">
    <div class="wrap">
      <p class="brand-en">Daniel’s Meal Coach</p>
      <div class="title-row">
        <h1>膳食教練</h1>
        <div class="title-tools">
          <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="true" aria-label="轉做淺色">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
              <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16.5 3.2a8.2 8.2 0 1 0 4.3 13.8A7 7 0 0 1 16.5 3.2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
            </svg>
            <span class="theme-word theme-word-light">淺色</span>
            <span class="theme-word theme-word-dark">深色</span>
          </button>
          <svg class="mark" viewBox="0 0 64 48" aria-hidden="true">
            <circle cx="18" cy="24" r="10" fill="none" stroke="#e15a4a" stroke-width="4"></circle>
            <circle cx="32" cy="24" r="10" fill="none" stroke="#3c9a45" stroke-width="4"></circle>
            <circle cx="46" cy="24" r="10" fill="none" stroke="#148a9a" stroke-width="4"></circle>
          </svg>
        </div>
      </div>
      <script>
        (function () {
          var button = document.getElementById("theme-toggle");
          if (!button) return;
          var dark = document.documentElement.getAttribute("data-theme") !== "light";
          button.setAttribute("aria-pressed", dark ? "true" : "false");
          button.setAttribute("aria-label", dark ? "轉做淺色" : "轉做深色");
        })();
      </script>
      <p class="lede">對住自己嘅配額，睇每日食咗幾多、郁咗幾多。</p>
      <p id="updated" class="meta"></p>
    </div>
  </header>
  <nav class="view-tabs" id="view-tabs" aria-label="主要畫面">
    <div class="wrap view-tabs-inner" role="tablist" aria-orientation="horizontal">
      <button type="button" class="view-tab" role="tab" id="tab-today" data-view="today" aria-controls="view-today" aria-selected="true">今日飲食</button>
      <button type="button" class="view-tab" role="tab" id="tab-trends" data-view="trends" aria-controls="view-trends" aria-selected="false" tabindex="-1">趨勢</button>
      <button type="button" class="view-tab" role="tab" id="tab-fitness" data-view="fitness" aria-controls="view-fitness" aria-selected="false" tabindex="-1">運動</button>
      <button type="button" class="view-tab" role="tab" id="tab-advice" data-view="advice" aria-controls="view-advice" aria-selected="false" tabindex="-1">建議</button>
    </div>
  </nav>
  <main class="wrap" id="app" tabindex="-1">
    <p class="loading">載入緊數據…</p>
  </main>
  <footer class="wrap site-footer">
    <p>數字全部來自 <a href="data.json">data.json</a>，頁面唔會自己加餐。呢個對照只係畀自己睇，唔係醫療或營養診斷。</p>
  </footer>
  <p id="live" class="visually-hidden" aria-live="polite"></p>
  <noscript>
    <p class="wrap">要開 JavaScript 先睇到圖表。數據喺 data.json。</p>
  </noscript>
  <script src="chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
